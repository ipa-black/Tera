name: Dump iOS Headers (dsdump + Strings)

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: 'رابط مباشر لملف الـ IPA الخاص باللعبة المعدلة'
        required: true
        type: string

jobs:
  dump_headers:
    runs-on: macos-latest

    steps:
      - name: Download and Validate IPA
        run: |
          echo "[*] Downloading IPA..."
          curl -L "${{ inputs.ipa_url }}" -o game.ipa
          
          FILE_TYPE=$(file -b game.ipa)
          if ! echo "$FILE_TYPE" | grep -qi "Zip archive data"; then
            echo "[خطأ فادح]: الملف ليس تطبيقاً صالحاً. يرجى التأكد من الرابط."
            exit 1
          fi
          echo "[نجاح] تم تحميل التطبيق."

      - name: Extract IPA
        run: unzip -q game.ipa -d extracted

      # التحديث الجوهري: استخراج المسار الدقيق للملف من Info.plist
      - name: Locate Exact Mach-O Binary
        run: |
          APP_DIR=$(find extracted/Payload -type d -name "*.app" | head -n 1)
          EXEC_NAME=$(plutil -extract CFBundleExecutable raw "$APP_DIR/Info.plist")
          BINARY_PATH="$APP_DIR/$EXEC_NAME"
          echo "BINARY_PATH=$BINARY_PATH" >> $GITHUB_ENV
          echo "Exact Binary Found: $BINARY_PATH"
          # فحص حجم الملف للتأكد أنه حقيقي وليس فارغاً
          ls -lh "$BINARY_PATH"

      - name: Install dsdump
        run: |
          echo "[*] Downloading dsdump directly..."
          curl -L "https://github.com/DerekSelander/dsdump/raw/master/dsdump_mac_os_x" -o dsdump
          chmod +x dsdump
          sudo mv dsdump /usr/local/bin/

      - name: Dump Headers & Strings (The Ultimate Extraction)
        run: |
          mkdir Headers
          echo "[*] Extracting Objective-C and Swift classes..."
          dsdump --objc "$BINARY_PATH" > Headers/ObjectiveC_Classes.txt || true
          dsdump --swift "$BINARY_PATH" > Headers/Swift_Classes.txt || true
          
          echo "[*] Extracting all texts, API links, and symbols (Fallback)..."
          # استخراج جميع النصوص الصريحة (روابط السيرفرات، رسائل الخطأ، أكواد التفعيل)
          strings "$BINARY_PATH" > Headers/App_Strings.txt
          # استخراج جميع دوال اللعبة الداخلية
          nm -a "$BINARY_PATH" > Headers/App_Symbols.txt || true

      - name: Upload Headers
        uses: actions/upload-artifact@v4
        with:
          name: iOS-Game-Classes-Dump
          path: Headers/
