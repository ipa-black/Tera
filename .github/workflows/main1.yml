name: Dump iOS Headers (dsdump)

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: 'رابط مباشر لملف الـ IPA الخاص باللعبة المعدلة'
        required: true
        type: string

jobs:
  dump_headers:
    runs-on: macos-latest

    steps:
      - name: Download and Validate IPA
        run: |
          echo "[*] Downloading IPA..."
          curl -L "${{ inputs.ipa_url }}" -o game.ipa
          
          FILE_TYPE=$(file -b game.ipa)
          if ! echo "$FILE_TYPE" | grep -qi "Zip archive data"; then
            echo "[خطأ فادح]: الملف ليس تطبيقاً صالحاً. يرجى التأكد من الرابط."
            exit 1
          fi
          echo "[نجاح] تم تحميل التطبيق."

      - name: Extract IPA
        run: unzip -q game.ipa -d extracted

      - name: Locate Mach-O Binary
        run: |
          APP_DIR=$(find extracted/Payload -type d -name "*.app" | head -n 1)
          APP_NAME=$(basename "$APP_DIR" .app)
          echo "BINARY_PATH=$APP_DIR/$APP_NAME" >> $GITHUB_ENV
          echo "Found Binary: $APP_DIR/$APP_NAME"

      # استخدام أداة dsdump الحديثة بدلاً من class-dump
      - name: Install dsdump (Modern Alternative)
        run: |
          curl -L "https://github.com/DerekSelander/dsdump/releases/download/v0.2.2/dsdump_mac_os_x.zip" -o dsdump.zip
          unzip dsdump.zip
          chmod +x dsdump
          sudo mv dsdump /usr/local/bin/

      - name: Dump Headers
        run: |
          mkdir Headers
          echo "[*] Extracting Objective-C and Swift classes..."
          # استخراج كود الأوبجكتف-سي في ملف نصي واحد
          dsdump --objc "$BINARY_PATH" > Headers/ObjectiveC_Classes.txt || true
          # استخراج كود سويفت في ملف نصي واحد
          dsdump --swift "$BINARY_PATH" > Headers/Swift_Classes.txt || true

      - name: Upload Headers
        uses: actions/upload-artifact@v4
        with:
          name: iOS-Game-Classes-Dump
          path: Headers/
