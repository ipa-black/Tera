name: Extract Mod Offsets
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4 # تم التحديث إلى v4

      - name: Setup Python
        uses: actions/setup-python@v5 # تم التحديث إلى v5
        with:
          python-version: '3.10'

      - name: Unzip Headers File (With Password)
        run: unzip -P 1 "8 Ball Pool_header.zip" -d ./

      - name: Run Extraction Script
        run: python extract_headers.py

      - name: Upload JSON Artifact
        uses: actions/upload-artifact@v4 # تم التحديث إلى v4 (هذا هو الذي سبب الخطأ)
        with:
          name: Offsets-JSON
          path: extracted_offsets.json
