name: Extract Mod Offsets
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Unzip Headers File (With Password)
        run: 7z x "8 Ball Pool_header.zip" -p1 -o./

      - name: Run Extraction Script
        run: python extract_headers.py

      - name: Upload JSON Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Offsets-JSON
          path: extracted_offsets.json
