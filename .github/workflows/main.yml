name: Universal App Extractor (IPA & APK)

on:
  workflow_dispatch: # لتشغيل الأكشن يدوياً

jobs:
  analyze_app:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Android Tools (Apktool)
        run: brew install apktool

      - name: Prepare Workspace
        run: mkdir ultimate_analysis

      - name: Detect and Analyze App
        run: |
          # البحث عن أي ملف ipa أو apk في المجلد الرئيسي
          TARGET_FILE=$(find . -maxdepth 1 \( -name "*.ipa" -o -name "*.apk" \) | head -n 1)
          
          if [ -z "$TARGET_FILE" ]; then
            echo "❌ لم يتم العثور على أي ملف .ipa أو .apk في المستودع!"
            exit 1
          fi
          
          echo "✅ تم العثور على الملف: $TARGET_FILE"
          
          # استخراج صيغة الملف (Extension)
          EXT="${TARGET_FILE##*.}"
          
          if [ "$EXT" == "ipa" ]; then
            echo "======================================"
            echo "🍎 بدء تحليل تطبيق iOS (IPA)..."
            echo "======================================"
            
            mkdir extracted_ipa
            mkdir ultimate_analysis/Bundled_Resources
            unzip -q "$TARGET_FILE" -d extracted_ipa
            
            # العثور على مجلد التطبيق والملف التنفيذي
            APP_DIR=$(find extracted_ipa/Payload -maxdepth 1 -name "*.app" | head -n 1)
            APP_NAME=$(basename "$APP_DIR" .app)
            BINARY_PATH="$APP_DIR/$APP_NAME"
            
            echo "1. استخراج Info.plist والصلاحيات..."
            plutil -p "$APP_DIR/Info.plist" > ultimate_analysis/1_Info_plist.txt || true
            codesign -d --entitlements :- "$APP_DIR" > ultimate_analysis/2_Entitlements.xml || true
            
            echo "2. استخراج النصوص، الروابط، والمكتبات..."
            strings "$BINARY_PATH" > ultimate_analysis/3_Strings.txt || true
            otool -L "$BINARY_PATH" > ultimate_analysis/4_Libraries.txt || true
            
            echo "3. استخراج قواعد البيانات والملفات المدمجة..."
            find "$APP_DIR" -type f \( -name "*.sqlite" -o -name "*.db" -o -name "*.json" -o -name "*.js" -o -name "*.m3u" \) -exec cp {} ultimate_analysis/Bundled_Resources/ \; || true
            
          elif [ "$EXT" == "apk" ]; then
            echo "======================================"
            echo "🤖 بدء تحليل تطبيق Android (APK)..."
            echo "======================================"
            
            # 1. استخدام Apktool لتفكيك التطبيق بالكامل
            echo "جاري تفكيك ملف الـ APK (قد يستغرق بعض الوقت)..."
            apktool d "$TARGET_FILE" -o ultimate_analysis/apk_decompiled
            
            # 2. استخراج النصوص والروابط المباشرة
            echo "استخراج النصوص السريعة..."
            strings "$TARGET_FILE" > ultimate_analysis/APK_Strings_Dump.txt || true
          fi

      - name: Upload Final Results
        uses: actions/upload-artifact@v4
        with:
          name: Extracted-App-Data
          path: ultimate_analysis/
