name: Download, Extract, and Repackage RE Files

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: 'ضع الرابط المباشر للملف المضغوط (Direct ZIP URL)'
        required: true
        type: string

jobs:
  process_zip_from_url:
    runs-on: ubuntu-latest
    
    steps:
      - name: Download the ZIP file
        run: |
          echo "Downloading file from the URL provided by LO..."
          wget -qO target_file.zip "${{ github.event.inputs.zip_url }}"
          
      - name: Extract the Downloaded ZIP
        run: |
          echo "Extracting the downloaded ZIP..."
          unzip -q target_file.zip -d extracted_contents/
          
      - name: Compress Target Folders & Generate JSON
        run: |
          echo "Processing folders and generating JSON for LO..."
          cd extracted_contents
          
          # متغيرات لتتبع حالة المجلدات
          JADX_STATUS="Not Found"
          APKTOOL_STATUS="Not Found"
          
          # التحقق من وجود مجلد jadx وضغطه
          if [ -d "apk_jadx" ]; then
            zip -r ../apk_jadx_ready.zip apk_jadx/
            JADX_STATUS="Found and Compressed"
          fi
          
          # التحقق من وجود مجلد apktool وضغطه
          if [ -d "apk_apktool" ]; then
            zip -r ../apk_apktool_ready.zip apk_apktool/
            APKTOOL_STATUS="Found and Compressed"
          fi
          
          cd ..
          
          # إنشاء ملف الـ JSON وكتابة المعلومات داخله
          echo '{
            "target_url": "${{ github.event.inputs.zip_url }}",
            "timestamp": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')",
            "github_run_id": "${{ github.run_id }}",
            "jadx_folder_status": "'"$JADX_STATUS"'",
            "apktool_folder_status": "'"$APKTOOL_STATUS"'"
          }' > extraction_info.json

      - name: Upload JADX Source Code
        uses: actions/upload-artifact@v4
        with:
          name: JADX_Source_Code
          path: apk_jadx_ready.zip
          retention-days: 7

      - name: Upload APKTool Resources
        uses: actions/upload-artifact@v4
        with:
          name: APKTool_Smali_Res
          path: apk_apktool_ready.zip
          retention-days: 7
          
      - name: Upload JSON Info File
        uses: actions/upload-artifact@v4
        with:
          name: Extraction_Information_JSON
          path: extraction_info.json
          retention-days: 7
